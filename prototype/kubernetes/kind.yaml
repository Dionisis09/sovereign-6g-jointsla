# Single local node; this is not a physical multi-edge deployment.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30090, hostPort: 8091, listenAddress: '127.0.0.1'}
      - {containerPort: 30091, hostPort: 9091, listenAddress: '127.0.0.1'}
      - {containerPort: 30092, hostPort: 3001, listenAddress: '127.0.0.1'}
