apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: jointsla-prototype
data:
  prometheus.yml: "global:\n  scrape_interval: 2s\n  evaluation_interval: 5s\nrule_files:\n\
    - /etc/prometheus/alerts.yml\nscrape_configs:\n- job_name: gateway\n  static_configs:\n\
    \  - targets:\n    - gateway:8090\n- job_name: inference\n  dns_sd_configs:\n\
    \  - names:\n    - inference.jointsla-prototype.svc.cluster.local\n    type: A\n\
    \    port: 8080\n    refresh_interval: 2s\n"
  alerts.yml: "groups:\n- name: jointsla.infrastructure\n  rules:\n  - alert: JointSLAGatewayUnavailable\n\
    \    expr: up{job=\"gateway\"} == 0\n    for: 15s\n    labels:\n      severity:\
    \ critical\n    annotations:\n      summary: Gateway metrics unavailable\n  -\
    \ alert: JointSLATelemetryStale\n    expr: time() - jointsla_gateway_snapshot_timestamp_seconds\
    \ > 10\n    for: 15s\n    labels:\n      severity: warning\n    annotations:\n\
    \      summary: Controller telemetry is stale\n  - alert: JointSLANoReadyInference\n\
    \    expr: jointsla_gateway_ready_replicas < 1\n    for: 10s\n    labels:\n  \
    \    severity: critical\n    annotations:\n      summary: No warm inference endpoint\n\
    \  - alert: JointSLAReconciliationFailure\n    expr: increase(jointsla_gateway_actions_total{outcome=\"\
    failed\"}[1m]) > 0\n    for: 10s\n    labels:\n      severity: warning\n    annotations:\n\
    \      summary: Kubernetes reconciliation failed\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: jointsla-prototype
data:
  prometheus.yaml: "apiVersion: 1\ndatasources:\n  - name: Prometheus\n    uid: prometheus\n\
    \    type: prometheus\n    access: proxy\n    url: http://prometheus:9090\n  \
    \  isDefault: true\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provider
  namespace: jointsla-prototype
data:
  default.yaml: "apiVersion: 1\nproviders:\n  - name: JointSLA\n    type: file\n \
    \   options:\n      path: /var/lib/grafana/dashboards\n"
---
