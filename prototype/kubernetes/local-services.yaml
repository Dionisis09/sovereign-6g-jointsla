apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: jointsla-prototype}
spec:
  type: NodePort
  selector: {app: jointsla-gateway}
  ports: [{port: 8090, targetPort: 8090, nodePort: 30090}]
---
apiVersion: v1
kind: Service
metadata: {name: inference, namespace: jointsla-prototype}
spec:
  clusterIP: None
  selector: {app: jointsla-inference}
  ports: [{port: 8080, targetPort: 8080}]
