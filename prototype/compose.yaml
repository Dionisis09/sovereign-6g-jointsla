name: jointsla-prototype
services:
  inference:
    build: {context: .., dockerfile: prototype/Dockerfile, target: inference}
    environment: {MODEL: mobilenet, DEVICE: cpu, PRETRAINED: 'true', QUEUE_LIMIT: '8'}
    expose: ['8080']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    mem_limit: 2g
    cpus: 1.0
    stop_grace_period: 65s
  gateway:
    build: {context: .., dockerfile: prototype/Dockerfile, target: controller}
    environment: {BACKEND: observe, INFERENCE_HOST: inference}
    ports: ['127.0.0.1:8090:8090']
    depends_on: {inference: {condition: service_healthy}}
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ['127.0.0.1:9090:9090']
    volumes: ['./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
  grafana:
    image: grafana/grafana:12.1.0
    ports: ['127.0.0.1:3000:3000']
    environment: {GF_AUTH_ANONYMOUS_ENABLED: 'true', GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer}
    volumes:
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
