[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst-phase0"
version = "0.1.0"
description = "Minimal paired experiment for runtime cross-layer contract enforcement"
requires-python = ">=3.12"
dependencies = ["simpy==4.1.2", "pydantic==2.13.5", "numpy==2.3.5", "pandas==3.0.1", "matplotlib==3.11.2"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]
maas = ["fastapi==0.163.1", "uvicorn==0.54.0", "httpx==0.28.1", "langgraph==1.2.22", "langgraph-checkpoint-sqlite==3.1.3"]
research = ["pyarrow==25.0.1"]
quality = ["ruff==0.17.5", "mypy==2.4.1"]

[tool.setuptools.packages.find]
include = ["catalyst*", "sovereign_maas*"]

[tool.setuptools.package-data]
sovereign_maas = ["maas_knowledge.json"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["sovereign_maas"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["prototype.*", "joint_sla_v2.*", "dynamic_placement.*", "joint_routing.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest-tmp"

