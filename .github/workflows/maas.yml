name: Sovereign MaaS local slice
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-research.txt -e ".[maas,research,test,quality]"
      - run: python -m sovereign_maas.evidence
      - run: python -m pytest -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - run: python -m ruff check sovereign_maas tests/test_sovereign_maas.py tests/test_sovereign_phase2.py tests/test_sovereign_phase3.py tests/test_sovereign_phase4.py tests/test_sovereign_phase5.py tests/test_sovereign_phase6.py tests/test_sovereign_phase7.py tests/test_sovereign_phase7_fresh.py tests/test_sovereign_phase7_sequence.py tests/test_sovereign_evidence.py
      - run: python -m ruff format --check sovereign_maas tests/test_sovereign_maas.py tests/test_sovereign_phase2.py tests/test_sovereign_phase3.py tests/test_sovereign_phase4.py tests/test_sovereign_phase5.py tests/test_sovereign_phase6.py tests/test_sovereign_phase7.py tests/test_sovereign_phase7_fresh.py tests/test_sovereign_phase7_sequence.py tests/test_sovereign_evidence.py
      - run: python -m mypy sovereign_maas
      - run: python -m sovereign_maas.demo
      - run: python -m sovereign_maas.research_runner --output results/phase2-ci
      - run: python -m sovereign_maas.phase4_demo
      - run: python -m sovereign_maas.research_phase4 --models results/phase2-ci --output results/phase4-ci
      - run: python -m sovereign_maas.phase6_demo
      - run: python -m sovereign_maas.research_phase7 --dataset results/phase2-ci --output results/phase7-ci
      - run: python -m sovereign_maas.research_phase7_fresh
      - run: python -m sovereign_maas.research_phase7_sequence
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-research.txt -e ".[maas,research,test]"
        working-directory: .
      - run: python scripts/phase5_frontend_smoke.py
        working-directory: .
      - run: python scripts/phase5_http_smoke.py
        working-directory: .
  compose_browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOVEREIGN_TENANT_TOKENS: '{"ci":"ci-local-token"}'
      SOVEREIGN_DASHBOARD_TENANT_TOKEN: ci-local-token
      SOVEREIGN_MODEL_DIR: /models/phase2-v1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: docker compose -f compose.maas.yaml config --quiet
      - run: docker compose -f compose.maas.yaml up --build --wait --wait-timeout 180
      - run: python scripts/compose_smoke.py
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - if: always()
        run: docker compose -f compose.maas.yaml logs --no-color --tail=80
      - if: always()
        run: docker compose -f compose.maas.yaml down -v --remove-orphans
  kind_dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[maas,test]"
      - name: Install pinned kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
      - run: kubectl version --client
      - run: kind create cluster --name sovereign-maas-ci --wait 120s
      - run: python -m scripts.kind_dryrun_smoke
      - if: always()
        run: kind delete cluster --name sovereign-maas-ci
